<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASIC HTML AND CSS QUIZ</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>
    <main class="box">
        <h1>&#x1F680; BASIC HTML AND CSS QUIZ</h1>
        <form class="box">
            <div class="quiz-item box">
                <label for="q1">1.What is a block element?</label>
                <input type="text" name="q1" id="q1" required>
            </div>

            <div class="quiz-item box">
                <label for="q2">2.What is css used for in building a webpage?</label>
                <textarea name="q2" id="q2" required></textarea> 
            </div>

            <div class="quiz-item box">
                <label for="q3">3.What is the full meaning of html?</label>
                <select name="q3" id="q3">  
                    <option value="" selected disabled>choose one ...</option>
                    <option value="a">hypertext mockup language</option>
                    <option value="b">hypertext markup language</option>
                    <option value="c">hypertext machine language</option>
                </select>  
            </div>

            <div class="quiz-item box">
                <label for="q4">4.What is the bottom margin given this declaration?</label>
                <code class="box">margin: 10px 5px 15px;</code>
                <input type="number" name="q4" id="q4">
            </div>

            <button type="submit">Submit Quiz for Grading</button>
        </form>
    </main>
</body>
</html>
