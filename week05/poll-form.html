<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Kelechi Jesil Samuel | WDD 130 </title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>
<header><h1>WWDD130 | HTML FORM - USER POLL</h1>
</header>
<body>
    <main>
        <form >
            <div class="form-item">
                 <div class="form-item column2">
            <label for="fullname">Full Name:</label>
            <input type="text" name="" id="fullname" required>
            </div>
            </div>
            <div class="form-item column2">
            <label for="useremail">Email</label>
            <input type="email" name="useremail" id="useremail" required>
            </div>
            
            <label for="quantity">select quantity</label>
            <select name="quantity" id="quantity">
                <option value="1">one</option>
                <option value="2">two</option>
                <option value="3">three</option>
            </select>
        </form>
        <form>
             <label for="browser">What is your favorite internet browser?</label>
<select id="browser" name="browser">
<option value="chrome">Chrome</option>
<option value="firefox">Firefox</option>
<option value="edge">Edge</option>
<option value="brave">Brave</option>
<option value="other">Other</option>
</select>
<label for="pet">Do you have a household pet?</label>
<input type="checkbox" id="pet" name="pet">
<label for="feedback">List the places you have lived:</label>
<textarea id="feedback" name="feedback" rows="4" placeholder="Stillwater Florida, Amsterdem Netherlands, Timbuktu Mali">
    
</textarea>
    <button type="submit">Submit poll</button>

</form>

    </main>
    <footer>
                <p>&copy;2026 &#10070;HTML FORM - USER POLL ACTIVITY | Kelechi Jesil Samuel &#10070; lagos, Nigeria</p>


    </footer>
</body>
</html>
